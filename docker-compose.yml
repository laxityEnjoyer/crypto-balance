version: '3.8'
services:
  cassandra:
    image: cassandra:4.1
    container_name: cassandra-trx
    environment:
      - CASSANDRA_CLUSTER_NAME=trx-dev
      - CASSANDRA_NUM_TOKENS=16
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=256M
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 10s
      timeout: 5s
      retries: 20
